# Alembic configuration for Syn.
# The database URL is injected by alembic/env.py from the application's
# typed settings (SYN_DATABASE_URL / .env), not hard-coded here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Leave empty here; env.py overrides it from app settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S